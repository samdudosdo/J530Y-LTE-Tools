name: Build J530Y LTE Tools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Remove UTF-8 BOM from Gradle files
        run: |
          find . -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 |
          while IFS= read -r -d '' file; do
            sed -i '1s/^\xEF\xBB\xBF//' "$file"
            echo "Cleaned: $file"
          done

      - name: Show Gradle files
        run: |
          echo "=== settings.gradle ==="
          sed -n '1,30p' settings.gradle
          echo "=== build.gradle ==="
          sed -n '1,30p' build.gradle
          echo "=== app/build.gradle ==="
          sed -n '1,50p' app/build.gradle

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J530Y-LTE-Tools
          path: app/build/outputs/apk/debug/app-debug.apk
